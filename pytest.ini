[pytest]
minversion = 8.0
addopts = -ra -q --strict-markers --html=reports/html/report.html --self-contained-html
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests/scenarios
markers =
    smoke: Critical smoke test coverage
    e2e: End-to-end user journey coverage
    regression: Regression coverage
    api: API-level checks
    ui: UI automation scenarios
    flaky: Scenarios with known instability in AUT behavior
bdd_features_base_dir = tests/features
